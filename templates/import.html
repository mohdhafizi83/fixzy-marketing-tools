{% extends "base.html" %}
{% block content %}
<h2>Import Leads</h2>
<form method="post">
  <p><label><input type="radio" name="mode" value="paste" checked> Tampal text (email/telefon)</label></p>
  <p><label><input type="radio" name="mode" value="crawl"> Crawl seluruh website</label>
     <input type="number" name="max_pages" value="20" min="1" max="200" style="width:80px"> page maks</p>
  <textarea name="text" rows="12" placeholder="ada@example.com, 012-345 6789, +60171234567 ... atau http://situs-target.com"></textarea>
  <p><button>Import</button></p>
</form>
<p style="color:#666">Nota: import manual dianggap consent untuk email (dicatat dalam ledger, sumber <code>import_paste</code>).
Untuk sumber crawl, semak sumber data anda mematuhi PDPA sebelum blast.</p>
{% endblock %}
