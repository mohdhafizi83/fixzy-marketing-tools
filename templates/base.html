<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fixzy Marketing Tools{% endblock %}</title>
  <meta name="csrf-token" content="{{ csrf_token_value }}">
  <!-- Self-hosted design system: Tabler Core (MIT) + Fixzy design tokens.
       No external CDNs — everything ships with the app. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/tabler.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<header>
  <strong>Fixzy Marketing Tools</strong>
  <nav style="display:inline-block; margin-left:24px;">
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('import_leads') }}">Import</a>
    <a href="{{ url_for('leads') }}">Leads</a>
    <a href="{{ url_for('campaign_new') }}">Campaign</a>
    <a href="{{ url_for('analytics') }}">Analytics</a>
    <a href="{{ url_for('inbox') }}">Inbox</a>
    <a href="{{ url_for('monitor_x') }}">X Monitor</a>
    <a href="{{ url_for('settings_llm') }}">Settings</a>
    <a href="{{ url_for('settings_channels') }}">Channels</a>
  </nav>
</header>
<main>
  {% with msgs = get_flashed_messages() %}
    {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
