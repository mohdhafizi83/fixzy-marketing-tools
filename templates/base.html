<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fixzy Marketing Tools{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #222; }
    header { background: #1a1f36; color: #fff; padding: 14px 24px; }
    header a { color: #9ecbff; text-decoration: none; margin-right: 16px; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .cards { display: flex; gap: 12px; flex-wrap: wrap; }
    .card { background: #fff; border-radius: 8px; padding: 16px 20px; min-width: 140px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card b { font-size: 1.6em; display: block; }
    .ok { color: #14804a; } .bad { color: #b00020; }
    table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 16px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; font-size: .92em; }
    textarea, input[type=text] { width: 100%; box-sizing: border-box; padding: 8px;
      font-family: monospace; }
    button { background: #2457c5; color: #fff; border: 0; border-radius: 6px;
             padding: 10px 18px; cursor: pointer; }
    .flash { background: #e6f4ea; border: 1px solid #b7dfc1; padding: 10px;
             border-radius: 6px; margin-bottom: 12px; }
  </style>
</head>
<body>
<header>
  <strong>Fixzy Marketing Tools</strong>
  <nav style="display:inline-block; margin-left:24px;">
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('import_leads') }}">Import</a>
    <a href="{{ url_for('leads') }}">Leads</a>
    <a href="{{ url_for('campaign_new') }}">Campaign</a>
    <a href="{{ url_for('analytics') }}">Analytics</a>
    <a href="{{ url_for('inbox') }}">Inbox</a>
    <a href="{{ url_for('monitor_x') }}">X Monitor</a>
    <a href="{{ url_for('settings_llm') }}">Settings</a>
  </nav>
</header>
<main>
  {% with msgs = get_flashed_messages() %}
    {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
