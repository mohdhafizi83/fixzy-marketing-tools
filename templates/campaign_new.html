{% extends "base.html" %}
{% block content %}
<h2>New Campaign</h2>
<form method="post">
  <p>Name: <input type="text" name="name" required></p>
  <p>Channel:
    <select name="channel">
      <option value="email">Email (Brevo)</option>
      <option value="telegram">Telegram Bot</option>
    </select></p>
  <p>Subject (email only): <input type="text" name="subject"></p>
  <textarea name="message" rows="10" required placeholder="Your message..."></textarea>
  <p><button>Save (draft)</button></p>
</form>
{% endblock %}
