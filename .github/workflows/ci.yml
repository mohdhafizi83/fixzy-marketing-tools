name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (supply-chain hygiene):
      # actions/checkout@v4    -> 11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python@v5 -> a26af69be951a213d495a4c3e4e4022e16d87065
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "ruff==0.16.10" "bandit==1.9.4" "pip-audit==2.10.1"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest tests -q
      - name: Static security analysis (bandit)
        run: bandit -r app.py models.py scheduler.py searchapi.py credentials.py netguard.py ratelimit.py aicopy.py crawler.py -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Known-vulnerability scan (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit==2.10.1"
          pip-audit -r requirements.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      # gitleaks/gitleaks-action@v2 -> dcedce43c6f43de0b836d1fe38946645c9c638dc
      # (free for personal/individual repos; no license key required)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
